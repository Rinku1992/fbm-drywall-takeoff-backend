name: 'Manual DRYWALL-PAGE-CLASSIFIER Cloud Run Build and Deploy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment (dev, QA, uat, or prod)'
        required: true
        type: choice
        options:
          - dev
          - QA
          - uat
          - prod

      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

jobs:
  build-and-deploy:
    name: 'Build, Push, and Deploy to Cloud Run'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: drywall-page-classifier

    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'QA' && vars.WIF_PROVIDER_QA || github.event.inputs.environment == 'uat' && vars.WIF_PROVIDER_UAT || github.event.inputs.environment == 'prod' && vars.WIF_PROVIDER_PROD || vars.WIF_PROVIDER_DEV }}
          service_account: ${{ github.event.inputs.environment == 'QA' && vars.SERVICE_ACCOUNT_QA || github.event.inputs.environment == 'uat' && vars.SERVICE_ACCOUNT_UAT || github.event.inputs.environment == 'prod' && vars.SERVICE_ACCOUNT_PROD || vars.SERVICE_ACCOUNT_DEV }}

      - name: 'Set GCP Project ID'
        run: |
          if [ "${{ github.event.inputs.environment }}" == "QA" ]; then
            echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID_QA }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "uat" ]; then
            echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID_UAT }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID_DEV }}" >> $GITHUB_ENV
          fi

      - name: "Set VPC Access Connector"
        run: |
          if [ "${{ github.event.inputs.environment }}" == "QA" ]; then
            echo "VPC_ACCESS_CONNECTOR=${{ vars.VPC_ACCESS_CONNECTOR_QA }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "uat" ]; then
            echo "VPC_ACCESS_CONNECTOR=${{ vars.VPC_ACCESS_CONNECTOR_UAT }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "VPC_ACCESS_CONNECTOR=${{ vars.VPC_ACCESS_CONNECTOR_PROD }}" >> $GITHUB_ENV
          else
            echo "VPC_ACCESS_CONNECTOR=${{ vars.VPC_ACCESS_CONNECTOR_DEV }}" >> $GITHUB_ENV
          fi

      - name: 'Set Model Bucket'
        run: |
          if [ "${{ github.event.inputs.environment }}" == "QA" ]; then
            echo "MODEL_BUCKET=${{ vars.MODEL_BUCKET_QA }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "uat" ]; then
            echo "MODEL_BUCKET=${{ vars.MODEL_BUCKET_UAT }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "MODEL_BUCKET=${{ vars.MODEL_BUCKET_PROD }}" >> $GITHUB_ENV
          else
            echo "MODEL_BUCKET=${{ vars.MODEL_BUCKET_DEV }}" >> $GITHUB_ENV
          fi

      - name: 'Set Image Details'
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          IMAGE_NAME="drywall-page-classifier"
          SERVICE_NAME="drywall-page-classifier"
          FINETUNED_MODEL_PATH="drywall_finetuning/page_classifier"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${SERVICE_NAME}" >> $GITHUB_ENV
          echo "FINETUNED_MODEL_PATH=${FINETUNED_MODEL_PATH}" >> $GITHUB_ENV
          echo "IMAGE_URI=gcr.io/${{ env.GCP_PROJECT_ID }}/${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_ENV

      - name: 'Set Cloud Run instance limits'
        run: |
          if [ "${{ github.event.inputs.environment }}" == "QA" ]; then
            echo "MIN_INSTANCES=1" >> $GITHUB_ENV
            echo "MAX_INSTANCES=3" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "uat" ]; then
            echo "MIN_INSTANCES=1" >> $GITHUB_ENV
            echo "MAX_INSTANCES=3" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "MIN_INSTANCES=1" >> $GITHUB_ENV
            echo "MAX_INSTANCES=3" >> $GITHUB_ENV
          else
            echo "MIN_INSTANCES=1" >> $GITHUB_ENV
            echo "MAX_INSTANCES=1" >> $GITHUB_ENV
          fi

       #  Set dynamic region
      - name: "Set Cloud Run region"
        run: |
          if [ "${{ github.event.inputs.environment }}" == "dev" ]; then
            echo "REGION=us-central1" >> $GITHUB_ENV
          else
            echo "REGION=us-east4" >> $GITHUB_ENV
          fi

      - name: 'Set up Google Cloud SDK'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: 'Submit Cloud Build'
        run: |
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project ${{ env.GCP_PROJECT_ID }} \
            --substitutions=_IMAGE_TAG=${{ env.IMAGE_TAG }},_MODEL_BUCKET=${{ env.MODEL_BUCKET }},_FINETUNED_MODEL_PATH=${{ env.FINETUNED_MODEL_PATH }},_IMAGE_NAME=${{ env.IMAGE_NAME }}

      - name: 'Deploy to Cloud Run'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URI }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --service-account ${{ github.event.inputs.environment == 'QA' && vars.SERVICE_ACCOUNT_QA || github.event.inputs.environment == 'uat' && vars.SERVICE_ACCOUNT_UAT || github.event.inputs.environment == 'prod' && vars.SERVICE_ACCOUNT_PROD || vars.SERVICE_ACCOUNT_DEV }} \
            --cpu 8 \
            --memory 32Gi \
            --gpu 1 \
            --gpu-type nvidia-l4 \
            --min-instances ${{ env.MIN_INSTANCES }} \
            --max-instances ${{ env.MAX_INSTANCES }} \
            --concurrency 1 \
            --execution-environment gen2 \
            --timeout 1800 \
            --ingress internal \
            --vpc-connector ${{ env.VPC_ACCESS_CONNECTOR }} \
            --vpc-egress all-traffic \
            --no-allow-unauthenticated
 