substitutions:
  _IMAGE_TAG: "latest"
  _MODEL_BUCKET: ""
  _FINETUNED_MODEL_PATH: "page_classifier"
  _IMAGE_NAME: "drywall-page-classifier"

steps:
  # Step 1: Download model checkpoint from GCS inside Cloud Build
  - id: "Download model checkpoint"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail

        echo "Downloading model checkpoint inside Cloud Build..."

        mkdir -p checkpoints

        echo "Downloading best.pth from:"
        echo "gs://${_MODEL_BUCKET}/${_FINETUNED_MODEL_PATH}/best.pth"

        gsutil -m -o "GSUtil:num_retries=5" cp \
          "gs://${_MODEL_BUCKET}/${_FINETUNED_MODEL_PATH}/best.pth" \
          checkpoints/best.pth

        echo "Validating downloaded checkpoint..."

        if [ ! -f "checkpoints/best.pth" ]; then
          echo "ERROR: checkpoints/best.pth not found after download."
          exit 1
        fi

        echo "Checkpoint downloaded successfully."
        du -sh checkpoints/best.pth
        ls -lh checkpoints/

  # Step 2: Build Docker image with model checkpoint baked in
  - id: "Build Docker image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--progress=plain"
      - "-t"
      - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:${_IMAGE_TAG}"
      - "-t"
      - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}:latest"
      - "."

  # Step 3: Push Docker image explicitly
  - id: "Push Docker image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/${PROJECT_ID}/${_IMAGE_NAME}"

options:
  machineType: "E2_HIGHCPU_8"
  diskSizeGb: 200

timeout: "3600s"